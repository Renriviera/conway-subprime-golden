name: check

on:
  push:
  pull_request:

jobs:
  sorry-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify zero sorries and frozen statements
        working-directory: lean
        run: python3 scripts/check.py
